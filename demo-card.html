<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>顾行之 · 数字人名片 · 示例样品</title>
<style>
  :root{
    --bg1:#070b12; --bg2:#0c1626; --cyan:#35d6ff; --cyan2:#7af0ff;
    --ink:#eaf6ff; --muted:#8aa0b8; --line:rgba(53,214,255,.28);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(53,214,255,.16), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(122,240,255,.10), transparent 55%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--ink);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 16px 36px; gap:18px;
  }
  /* 名片成品图（已经是渲染好的 PNG，所见即所得） */
  .card-img{
    width:min(660px, 94vw); height:auto; display:block;
    border-radius:20px;
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 70px rgba(53,214,255,.12);
  }
  .actions{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .btn{
    appearance:none; border:1px solid var(--line); cursor:pointer;
    background:rgba(53,214,255,.1); color:var(--cyan2);
    font-size:14px; padding:11px 20px; border-radius:12px;
    text-decoration:none; display:inline-block; transition:.18s; font-family:inherit;
  }
  .btn:hover{ background:rgba(53,214,255,.2); transform:translateY(-1px); }
  .btn.primary{
    background:linear-gradient(135deg,var(--cyan),#1aa6c8);
    color:#04121a; border-color:transparent; font-weight:700;
  }
  .hint{ font-size:11.5px; color:var(--muted); text-align:center; line-height:1.7; }
</style>
</head>
<body>
  <!-- 成品名片：直接是一张 PNG，保存=下载原图，100% 成功 -->
  <img class="card-img" src="assets/images/demo-card.png" alt="顾行之 数字人名片" />

  <div class="actions">
    <a class="btn primary" id="saveBtn" href="assets/images/demo-card.png" download="顾行之-数字人名片.png">保存名片图片</a>
    <button class="btn" id="copyBtn" type="button">复制链接</button>
  </div>
  <p class="hint">
    提示：点「保存名片图片」直接下载 PNG；手机上若弹出预览，长按图片即可保存。<br/>
    扫码直达样品站：https://saphinie.github.io/personal-website/demo/
  </p>

  <script>
    document.getElementById('copyBtn').addEventListener('click', async function () {
      const url = 'https://saphinie.github.io/personal-website/demo/';
      try { await navigator.clipboard.writeText(url); }
      catch (e) {
        const t = document.createElement('textarea');
        t.value = url; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); } catch (e2) {}
        document.body.removeChild(t);
      }
      const old = this.textContent;
      this.textContent = '已复制 ✓';
      setTimeout(() => (this.textContent = old), 1400);
    });
  </script>
</body>
</html>
