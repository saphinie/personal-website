<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>顾行之 · 数字人名片 · 示例样品</title>
<style>
  :root{
    --bg1:#070b12; --bg2:#0c1626; --cyan:#35d6ff; --cyan2:#7af0ff;
    --ink:#eaf6ff; --muted:#8aa0b8; --line:rgba(53,214,255,.28);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(53,214,255,.16), transparent 60%),
      radial-gradient(900px 500px at 0% 110%, rgba(122,240,255,.10), transparent 55%),
      linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--ink);
    min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 16px 36px; gap:18px;
  }
  /* ===== 名片本体（横向，约 1.65:1） ===== */
  #card{
    position:relative; width:660px; height:400px;
    background:linear-gradient(135deg, rgba(12,22,38,.96), rgba(7,11,18,.98));
    border:1px solid var(--line); border-radius:26px; overflow:hidden;
    box-shadow:0 0 0 1px rgba(53,214,255,.06), 0 30px 80px rgba(0,0,0,.55), 0 0 70px rgba(53,214,255,.12);
  }
  /* 网格底纹 */
  #card::before{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image:
      linear-gradient(rgba(53,214,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(53,214,255,.06) 1px, transparent 1px);
    background-size:28px 28px;
    mask-image:radial-gradient(120% 100% at 30% 50%, #000 45%, transparent 100%);
  }
  /* 顶部光晕 */
  #card .glow{
    position:absolute; top:-90px; left:120px; width:300px; height:300px; border-radius:50%;
    background:radial-gradient(circle, rgba(53,214,255,.30), transparent 65%);
    filter:blur(10px); pointer-events:none;
  }
  .c-inner{ position:relative; z-index:2; height:100%; display:flex; align-items:stretch;
    padding:30px 34px; gap:26px; }
  /* 左侧信息 */
  .c-left{ display:flex; flex-direction:column; justify-content:center; min-width:300px; }
  .tag{
    align-self:flex-start;
    font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;
    font-size:11px; letter-spacing:.28em; color:var(--cyan2);
    border:1px solid var(--line); border-radius:999px; padding:5px 13px;
    background:rgba(53,214,255,.06); backdrop-filter:blur(4px);
  }
  .who{ display:flex; align-items:center; gap:16px; margin-top:18px; }
  .avatar{
    width:84px; height:84px; border-radius:50%; object-fit:cover;
    border:2px solid rgba(53,214,255,.55);
    box-shadow:0 0 0 6px rgba(53,214,255,.08), 0 0 26px rgba(53,214,255,.32);
  }
  .name{ font-size:30px; font-weight:800; letter-spacing:.04em;
    text-shadow:0 0 18px rgba(53,214,255,.35); }
  .role{ margin-top:6px; font-size:13.5px; color:var(--cyan2); letter-spacing:.05em; }
  .divider{ width:100%; height:1px; margin:18px 0 14px;
    background:linear-gradient(90deg, transparent, var(--line), transparent); }
  .lead{ font-size:12.5px; color:var(--muted); line-height:1.75; max-width:320px; }
  .lead b{ color:var(--ink); font-weight:600; }
  .foot{ position:absolute; bottom:16px; left:34px; z-index:2;
    font-size:10.5px; color:rgba(138,160,184,.7); letter-spacing:.14em;
    font-family:ui-monospace,monospace; }
  /* 右侧二维码 */
  .c-right{ display:flex; flex-direction:column; align-items:center; justify-content:center;
    margin-left:auto; gap:12px; }
  .qr-wrap{
    background:rgba(255,255,255,.97); border-radius:18px; padding:14px;
    border:1px solid rgba(53,214,255,.5);
    box-shadow:0 0 26px rgba(53,214,255,.25);
  }
  #qrcode{ display:block; width:180px; height:180px; border-radius:8px; }
  .qr-tip{ font-size:12.5px; color:var(--cyan2); letter-spacing:.05em; }
  .url{
    font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--muted);
    word-break:break-all; text-align:center; max-width:240px; line-height:1.5;
  }
  /* ===== 操作按钮 ===== */
  .actions{ display:flex; gap:12px; }
  .btn{
    appearance:none; border:1px solid var(--line); cursor:pointer;
    background:rgba(53,214,255,.1); color:var(--cyan2);
    font-size:14px; padding:11px 20px; border-radius:12px;
    backdrop-filter:blur(4px); transition:.18s; font-family:inherit;
  }
  .btn:hover{ background:rgba(53,214,255,.2); transform:translateY(-1px); }
  .btn.primary{ background:linear-gradient(135deg,var(--cyan),#1aa6c8); color:#04121a; border-color:transparent; font-weight:700; }
  .hint{ font-size:11.5px; color:var(--muted); }
</style>
</head>
<body>
  <div id="card">
    <div class="glow"></div>
    <div class="c-inner">
      <div class="c-left">
        <span class="tag">DIGITAL HUMAN · DEMO 样板</span>
        <div class="who">
          <img class="avatar" src="demo/assets/images/avatar.jpg" alt="顾行之" />
          <div>
            <div class="name">顾行之</div>
            <div class="role">品牌策划人 × AI 创作者</div>
          </div>
        </div>
        <div class="divider"></div>
        <p class="lead">扫码进入我的 <b>3D 数字人主页</b> ——<br/>看看用 AI 把个人能力做成主页，<br/>能呈现成什么样子。</p>
      </div>
      <div class="c-right">
        <div class="qr-wrap">
          <img id="qrcode" src="assets/images/qr-demo.png" alt="扫码访问样品站" />
        </div>
        <div class="qr-tip">长按或扫码访问</div>
        <div class="url" id="urlText">https://saphinie.github.io/personal-website/demo/</div>
      </div>
    </div>
    <div class="foot">SAMPLE · 示例样品（人物与经历均为虚构）</div>
  </div>

  <div class="actions">
    <button class="btn primary" id="saveBtn">保存名片图片</button>
    <button class="btn" id="copyBtn">复制链接</button>
  </div>
  <p class="hint">提示：手机上打开本页，点「保存名片图片」即可存为图片，发微信/朋友圈当名片用。</p>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const SHARE_URL = 'https://saphinie.github.io/personal-website/demo/';

    document.getElementById('saveBtn').addEventListener('click', () => {
      const node = document.getElementById('card');
      html2canvas(node, { backgroundColor: null, scale: 3, useCORS: true, logging: false })
        .then((canvas) => {
          const a = document.createElement('a');
          a.download = '顾行之-数字人名片.png';
          a.href = canvas.toDataURL('image/png');
          a.click();
        });
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(SHARE_URL); } catch (e) {}
      const b = document.getElementById('copyBtn');
      const t = b.textContent; b.textContent = '已复制 ✓';
      setTimeout(() => (b.textContent = t), 1400);
    });
  </script>
</body>
</html>
